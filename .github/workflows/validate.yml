name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install --require-hashes -r .github/requirements.txt
      - name: Generated files are up to date
        run: |
          node scripts/gen-schemas.mjs
          python scripts/gen-conformance.py
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "Generated files differ. Edit scripts/, run both generators and commit the result."
            exit 1
          fi
      - name: Schemas, example and conformance cases
        run: python .github/scripts/validate.py
